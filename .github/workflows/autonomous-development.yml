name: Autonomous development

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_run:
    workflows: ["Python checks"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: autonomous-development-${{ github.repository }}
  cancel-in-progress: false

jobs:
  develop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.body, '<!-- aegis-autonomous-task -->')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'agent/autonomous-task-'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      FAILED_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Check required credentials
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Add the COPILOT_GITHUB_TOKEN Actions secret; see docs/autonomous-development.md."
            exit 1
          fi
          if [[ -z "$AUTOMATION_TOKEN" ]]; then
            echo "::error::Add the AUTOMATION_TOKEN Actions secret; see docs/autonomous-development.md."
            exit 1
          fi

      - name: Check out repository without persisting credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch || 'main' }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select a single task or repair target
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ -z "$FAILED_PR_NUMBER" || "$FAILED_PR_NUMBER" == "null" ]]; then
              echo "No associated pull request; skipping repair."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PR_JSON="$(gh pr view "$FAILED_PR_NUMBER" --repo "$REPO" --json state,baseRefName,headRefName,body)"
            PR_STATE="$(jq -r '.state' <<< "$PR_JSON")"
            PR_BASE="$(jq -r '.baseRefName' <<< "$PR_JSON")"
            PR_HEAD="$(jq -r '.headRefName' <<< "$PR_JSON")"
            PR_BODY="$(jq -r '.body // ""' <<< "$PR_JSON")"
            if [[ "$PR_STATE" != "OPEN" || "$PR_BASE" != "main" || "$PR_HEAD" != "$FAILED_BRANCH" || "$PR_BODY" != *"<!-- aegis-autonomous-task -->"* ]]; then
              echo "The failed run is not attached to an open autonomous task PR; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git log -n 8 --format=%B | grep -q 'AUTONOMOUS_REPAIR_ATTEMPT_1'; then
              echo "::error::The autonomous PR already used its one same-branch CI repair; leaving it open for human intervention."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=repair" >> "$GITHUB_OUTPUT"
            echo "branch=$FAILED_BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_number=$FAILED_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            OPEN_PRS="$(gh pr list --repo "$REPO" --state open --base main --json number)"
            if [[ "$(jq 'length' <<< "$OPEN_PRS")" -gt 0 ]]; then
              echo "An open PR already targets main; one-PR-at-a-time guard stopped this run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            RECENT_COUNT="$(gh api "repos/$REPO/pulls?state=closed&base=main&per_page=100" --jq '[.[] | select(.merged_at != null and ((.body // "") | contains("<!-- aegis-autonomous-task -->")) and ((.merged_at | fromdateiso8601) >= (now - 86400)))] | length')"
            if [[ "$RECENT_COUNT" -ge 3 ]]; then
              echo "Daily safety cap reached: at most three autonomous task PRs may merge in a rolling 24-hour window."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            BRANCH="agent/autonomous-task-$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_NUMBER"
            git switch --create "$BRANCH" origin/main
            echo "mode=new" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect failed CI logs for a repair
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.mode == 'repair'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          gh run view "$FAILED_RUN_ID" --repo "$REPO" --log-failed > "$RUNNER_TEMP/failed-ci.log" || true

      - name: Install project dependencies
        if: steps.select.outputs.skip != 'true'
        run: |
          python -m pip install "uv==0.13.0"
          uv sync --locked --extra dev
          uv run --locked playwright install --with-deps chromium

      - name: Run Copilot on one task or same-branch repair
        if: steps.select.outputs.skip != 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK_MODE: ${{ steps.select.outputs.mode }}
          TASK_BRANCH: ${{ steps.select.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ "$TASK_MODE" == "repair" ]]; then
            PROMPT="$(cat <<'PROMPT'
          Repair the failing checks for the current open autonomous task pull request on this same branch. Read /tmp/failed-ci.log and the repository handoff first. Make the smallest correction, add or adjust regression tests, and update docs/chatbot-handoff.md in this same PR. Do not start a new feature, change workflow/security configuration, dependency manifests or lockfiles, contracts, secrets, or execution scope. Run uv run --locked ruff check . and uv run --locked python -m pytest -q. Do not commit, push, create PRs, or merge; the workflow handles Git operations. A maximum of one CI repair is allowed for a task PR.
          PROMPT
          )"
            cp "$RUNNER_TEMP/failed-ci.log" /tmp/failed-ci.log
          else
            PROMPT="$(cat <<'PROMPT'
          Implement exactly one small, coherent, unfinished task from docs/chatbot-handoff.md. Inspect existing routes, service boundaries, frontend data flow and tests before deciding; prefer the next explicitly listed roadmap item and avoid duplicate endpoints. Preserve the testnet-only Aegis Agent Wallet scope: simulated execution by default, actual ERC-20 only through the unaudited AegisVault on Base Sepolia chain ID 84532, owner approval and policy enforcement intact, no mainnet/production claims, no secrets/private keys. Do not change .github/**, pyproject.toml, uv.lock, contracts/**, security configuration, or deployment settings. Add focused regression tests, update docs/chatbot-handoff.md, and run uv run --locked ruff check . plus uv run --locked python -m pytest -q. Do not commit, push, create PRs, or merge; the workflow handles Git operations. Do not take on more than one task. In docs/chatbot-handoff.md include the exact phrase "PR details will be recorded by automation." in the current-task bullet so the workflow can replace it with the created PR number and URL. Write .autonomous-task-result.json containing valid JSON with string fields title, description, and summary; title must be plain English without a conventional prefix, description must be one sentence, and summary must be a concise task label. Do not include secrets in this file.
          PROMPT
          )"
          fi
          copilot --autopilot --no-ask-user --max-autopilot-continues 3 --max-ai-credits 100 -p "$PROMPT" \
            --allow-tool='shell(git:*)' \
            --allow-tool='shell(uv:*)' \
            --allow-tool=read \
            --allow-tool=write

      - name: Validate scope and task output
        if: steps.select.outputs.skip != 'true'
        shell: bash
        env:
          TASK_MODE: ${{ steps.select.outputs.mode }}
        run: |
          set -euo pipefail
          CHANGED="$(git status --short)"
          if [[ -z "$CHANGED" ]]; then
            echo "::error::Copilot produced no changes; stopping without a PR."
            exit 1
          fi
          if git diff --name-only | grep -E '^(\.github/|pyproject\.toml$|uv\.lock$|contracts/|\.forge/|aegis-agent-wallet-handoff\.md$)'; then
            echo "::error::The task touched protected or user-owned paths; refusing to publish."
            exit 1
          fi
          if [[ "$TASK_MODE" == "new" ]]; then
            if ! git diff --name-only | grep -qx 'docs/chatbot-handoff.md'; then
              echo "::error::Every autonomous feature PR must update docs/chatbot-handoff.md."
              exit 1
            fi
            jq -e '.title | type == "string" and length > 0 and length <= 100' .autonomous-task-result.json >/dev/null
            jq -e '.description | type == "string" and length > 0 and length <= 300' .autonomous-task-result.json >/dev/null
            jq -e '.summary | type == "string" and length > 0 and length <= 120' .autonomous-task-result.json >/dev/null
            if ! grep -Fq 'PR details will be recorded by automation.' docs/chatbot-handoff.md; then
              echo "::error::Handoff must include the required PR-details placeholder."
              exit 1
            fi
          fi
      - name: Publish the task branch and open or update its PR
        if: steps.select.outputs.skip != 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          TASK_MODE: ${{ steps.select.outputs.mode }}
          TASK_BRANCH: ${{ steps.select.outputs.branch }}
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TASK_MODE" == "new" ]]; then
            TITLE="$(jq -r '.title' .autonomous-task-result.json)"
            DESCRIPTION="$(jq -r '.description' .autonomous-task-result.json)"
            SUMMARY="$(jq -r '.summary' .autonomous-task-result.json)"
            rm -f .autonomous-task-result.json
            git add -A
            git commit -m "$SUMMARY"
            git push --set-upstream origin "$TASK_BRANCH"
            PR_URL="$(gh pr create --repo "$REPO" --base main --head "$TASK_BRANCH" --title "$TITLE" --body "$DESCRIPTION"$'\n\n<!-- aegis-autonomous-task -->')"
            PR_NUMBER="$(gh pr view "$PR_URL" --repo "$REPO" --json number --jq '.number')"
            python - "$PR_NUMBER" "$PR_URL" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path("docs/chatbot-handoff.md")
          text = path.read_text(encoding="utf-8")
          old = "PR details will be recorded by automation."
          new = f"tracked in PR #{sys.argv[1]} ({sys.argv[2]})."
          if old not in text:
              raise SystemExit("Required handoff placeholder was missing.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
            git add docs/chatbot-handoff.md
            git commit -m "Record autonomous task pull request"
            git push origin "$TASK_BRANCH"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "Fix autonomous task CI checks [AUTONOMOUS_REPAIR_ATTEMPT_1]"
            git push origin "$TASK_BRANCH"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "pr_url=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json url --jq '.url')" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for required PR checks
        if: steps.select.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_URL" --repo "$REPO" --watch --interval 10

      - name: Enable squash auto-merge after checks pass
        if: steps.select.outputs.skip != 'true' && steps.select.outputs.mode == 'new'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --repo "$REPO" --auto --squash
