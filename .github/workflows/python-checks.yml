name: Python checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install "uv==0.13.0"

      - name: Install locked project and development dependencies
        run: uv sync --locked --extra dev

      - name: Install Chromium for frontend browser tests
        run: uv run --locked playwright install --with-deps chromium

      - name: Run tests
        run: uv run --locked python -m pytest -q

      - name: Install dependency audit tooling
        run: |
          uv pip install --python .venv/bin/python "setuptools>=83.0.0" "pip-audit==2.10.1"

      - name: Audit installed Python dependencies
        run: .venv/bin/python -m pip_audit --skip-editable

      - name: Run Ruff
        run: uv run --locked ruff check .
