[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-agent-wallet"
version = "1.10.3"
description = "Policy, risk, and approval workflow simulation for an AI agent wallet"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0", "httpx>=0.27,<1.0", "eth-account>=0.13,<1.0", "eth-utils>=5.0,<7.0"]

[project.optional-dependencies]
dev = ["playwright>=1.50,<2.0", "pytest>=8.0,<10.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*", "agent*"]
